                - link "Card modifiers" [ref=f21e96] [cursor=pointer]:
                  - /url: /w/Card_modifiers
                - text: ": Card modifiers activate in the following order: enhancements, then seals (currently only"
                - generic [ref=f21e98]:
                  - link [ref=f21e101] [cursor=pointer]:
                    - /url: /w/Gold_Seal
                  - link [ref=f21e104] [cursor=pointer]:
                    - /url: /w/Gold_Seal
                - link "Gold Seal" [ref=f21e105] [cursor=pointer]:
                  - /url: /w/Gold_Seal
                - text: ), then editions.
              - listitem [ref=f21e107]:
                - link "'On scored'" [ref=f21e108] [cursor=pointer]:
                  - /url: /w/Activation_Type
                - text: "Jokers: Jokers that activate on a played and scored card will activate their effects. When multiple Jokers are triggered by the same card, they activate from left to right. Examples include"
                - link [ref=f21e111] [cursor=pointer]:
                  - /url: /w/Wee_Joker
                - link "Wee Joker" [ref=f21e113] [cursor=pointer]:
                  - /url: /w/Wee_Joker
                - text: "'s scaling,"
