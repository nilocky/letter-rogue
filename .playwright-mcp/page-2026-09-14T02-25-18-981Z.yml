                - link [ref=f21e123] [cursor=pointer]:
                  - /url: /w/Triboulet
                - link "Triboulet" [ref=f21e125] [cursor=pointer]:
                  - /url: /w/Triboulet
                - text: .
              - listitem [ref=f21e127]:
                - text: "Retriggers: Each retrigger repeats the previous activation sequence (from base effects to scored card dependent Jokers) one more time. Multiple retriggers stack additively."
                - generic [ref=f21e129]:
