          - listitem [ref=f21e92]:
            - text: "Played cards scoring: Cards played and scored activate from left to right. For each card, its effects activate in the following order:"
            - list [ref=f21e93]:
              - listitem [ref=f21e94]: "Base effect (Chips): The card activates its base effect, giving the accorded amount of Chips. Bonus chips are included in this value."
